<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>TO DO LIST ONLINE</title>
    <link rel="stylesheet" href="app.css">
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <h1 class="main-title">TO DO LIST</h1>
    
    <div class="input">
        <input id="inputTask" placeholder="Введіть задачу...">
        <button id="addButton">Додати</button>
        <button id="exampleButton">Побачити приклади задач</button>
    </div>

    <div class="selectPriority">
        <label for="priority">Пріоритет для задачі:</label>
        <select id="priority">
        <option value="1">1 (низький)</option>
        <option value="2">2 (середній)</option>
        <option value="3">3 (високий)</option>
        </select>
    </div>

    <div class="filter">
    <button class="filter-btn active" data-filter="all">Усі</button>
    <button class="filter-btn" data-filter="active">Активні</button>
    <button class="filter-btn" data-filter="done">Виконані</button>

    <button class="filter-btn" data-filter="1">Низький пріоритет</button>
    <button class="filter-btn" data-filter="2">Середній пріоритет</button>
    <button class="filter-btn" data-filter="3">Високий пріоритет</button>
    </div>

    <div class="card">
        <ul id="taskList"></ul>
        <div class="card-footer">
            <span id="taskCount">0 задач</span>
        </div> 
    </div> 
    <div id="overlay" class="hidden"></div>
    <div id="previewPanel" class="hidden">
        <ul id="previewList"></ul>
        <button id="addSelected">Додати вибране завдання</button>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
